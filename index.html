<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 采用浏览器专用的海量数据库 IndexedDB，不限容量，不卡顿
  const DB_NAME = 'SignalCollisionDB';
  const STORE_NAME = 'collisions';
  let db = null;
  let pendingRecords = [];

  // 打开/初始化本地海量数据库
  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = function(e) {
        const dbInstance = e.target.result;
        if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
          // 以纯数字作为主键/索引，方便秒查
          const store = dbInstance.createObjectStore(STORE_NAME, { keyPath: 'clean_digits' });
          store.createIndex('clean_digits', 'clean_digits', { unique: true });
        }
      };
      request.onsuccess = function(e) {
        db = e.target.result;
        updateTotalCount();
        resolve(db);
      };
      request.onerror = function(e) {
        reject(e);
      };
    });
  }

  function cleanToDigits(str) {
    if (!str) return '';
    return String(str).replace(/\D/g, '');
  }

  // 刷新当前总收录量
  function updateTotalCount() {
    if (!db) return;
    const tx = db.transaction([STORE_NAME], 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const countReq = store.count();
    countReq.onsuccess = function() {
      const badge = document.getElementById('dbCountBadge');
      if (badge) badge.innerText = `当前库中已收录: ${countReq.result} 个撞车号码`;
    };
  }

  // 1. 查询逻辑（基于索引秒查，毫秒级响应）
  async function searchNumber() {
    const rawInput = document.getElementById('checkInput').value.trim();
    const resultArea = document.getElementById('searchResultArea');
    if (!rawInput) {
      resultArea.innerHTML = '<div class="alert alert-warning mt-3">请输入需要查询的号码！</div>';
      return;
    }
    const inputDigits = cleanToDigits(rawInput);
    if (!inputDigits) {
      resultArea.innerHTML = '<div class="alert alert-warning mt-3">请输入有效数字！</div>';
      return;
    }

    const tx = db.transaction([STORE_NAME], 'readonly');
    const store = tx.objectStore(STORE_NAME);
    
    // 先精确查询
    const getReq = store.get(inputDigits);
    getReq.onsuccess = function() {
      let hit = getReq.result;
      if (hit) {
        renderHit(hit, rawInput);
      } else {
        // 如果输入的是短号（如 7 位），进行范围游标尾号模糊匹配
        let matched = false;
        const cursorReq = store.openCursor();
        cursorReq.onsuccess = function(e) {
          const cursor = e.target.result;
          if (cursor) {
            if (cursor.key.endsWith(inputDigits) || inputDigits.endsWith(cursor.key)) {
              renderHit(cursor.value, rawInput);
              matched = true;
              return;
            }
            cursor.continue();
          } else {
            if (!matched) {
              resultArea.innerHTML = `
                <div class="alert alert-success p-3 mt-3">
                  <h5 class="text-success fw-bold mb-1">✔ 安全！未查询到历史撞车记录</h5>
                  <p class="mb-0 text-muted">该号码（${rawInput}）未在底库中出现过，可正常对接。</p>
                </div>
              `;
            }
          }
        };
      }
    };
  }

  function renderHit(hit, rawInput) {
    const resultArea = document.getElementById('searchResultArea');
    resultArea.innerHTML = `
      <div class="alert alert-danger p-3 mt-3 shadow-sm" style="border-left: 6px solid #dc3545;">
        <h4 class="text-danger fw-bold mb-3">🚨 撞车警告！该号码之前已被发过！</h4>
        <div class="mb-2 fs-5"><strong>• 查询号码：</strong> <span class="badge bg-danger">${rawInput}</span></div>
        <div class="mb-2"><strong>• 发件人 / 报备人：</strong> <span class="text-primary fw-bold">${hit.sender || '未知'}</span></div>
        <div class="mb-2"><strong>• 发生时间：</strong> <span class="text-muted">${hit.time || '历史导入'}</span></div>
        <div class="mt-3">
          <div class="small text-muted fw-bold mb-1">原始聊天记录原话：</div>
          <div class="quote-box">${hit.quote || hit.raw_phone}</div>
        </div>
      </div>
    `;
  }

  // 2. 单号录入逻辑
  function submitSingleRecord() {
    const phone = document.getElementById('singlePhone').value.trim();
    const sender = document.getElementById('singleSender').value.trim() || '手动报备';
    const quote = document.getElementById('singleQuote').value.trim();
    const statusDiv = document.getElementById('singleStatus');

    if (!phone) {
      statusDiv.innerHTML = '<div class="alert alert-warning">请填写号码！</div>';
      return;
    }
    const cleanNum = cleanToDigits(phone);
    const newRecord = {
      raw_phone: phone,
      clean_digits: cleanNum,
      sender: sender,
      time: new Date().toLocaleString(),
      quote: quote || `[${new Date().toLocaleString()}] ${sender}: ${phone}`
    };

    const tx = db.transaction([STORE_NAME], 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put(newRecord);
    tx.oncomplete = function() {
      statusDiv.innerHTML = `<div class="alert alert-success">✔ 号码 <b>${phone}</b> 已成功录入海量数据库！</div>`;
      document.getElementById('singlePhone').value = '';
      document.getElementById('singleQuote').value = '';
      updateTotalCount();
    };
  }

  // 3. 极速逐行分块解析器
  function parseRawContent(text, defaultSource) {
    const lines = text.split('\n');
    const map = new Map();
    const chatPattern = /^\[?(\d{4}[-/.]\d{1,2}[-/.]\d{1,2}[^\]]*)\]?\s*([^:]+?):\s*(.*)$/;
    const phonePattern = /(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}|\b\d{3}-\d{4}\b|\b1\d{10}\b/g;

    for (let i = 0; i < lines.length; i++) {
      const trimmed = lines[i].trim();
      if (!trimmed) continue;

      let msgTime = '';
      let sender = defaultSource || '未知';
      let content = trimmed;

      if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
        try {
          const jsonItem = JSON.parse(trimmed);
          content = jsonItem.body || jsonItem.text || '';
          sender = jsonItem.senderName || jsonItem.author || defaultSource;
          if (jsonItem.timestamp) msgTime = new Date(jsonItem.timestamp).toLocaleString();
        } catch (e) {
          content = trimmed;
        }
      } else {
        const match = trimmed.match(chatPattern);
        if (match) {
          msgTime = match[1].trim();
          sender = match[2].trim();
          content = match[3].trim();
        }
      }

      const matches = content.match(phonePattern);
      if (matches) {
        for (let j = 0; j < matches.length; j++) {
          const digits = cleanToDigits(matches[j]);
          if (digits.length >= 7 && !map.has(digits)) {
            map.set(digits, {
              raw_phone: matches[j].trim(),
              clean_digits: digits,
              sender: sender,
              time: msgTime || new Date().toLocaleDateString(),
              quote: trimmed
            });
          }
        }
      }
    }
    return Array.from(map.values());
  }

  function processSingleFile(event) {
    const file = event.target.files[0];
    if (file) readFile(file);
  }

  function processFolder(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;
    Array.from(files).forEach(f => {
      if (f.name.endsWith('.txt') || f.name.endsWith('.jsonl') || f.name.endsWith('.csv')) {
        readFile(f);
      }
    });
  }

  function readFile(file) {
    const defaultSource = document.getElementById('batchSource').value.trim() || file.name;
    const progress = document.getElementById('parseProgress');
    progress.classList.remove('d-none');
    progress.innerText = `正在高速分析文件: ${file.name}...`;

    const reader = new FileReader();
    reader.onload = function(e) {
      const records = parseRawContent(e.target.result, defaultSource);
      pendingRecords = pendingRecords.concat(records);

      progress.innerHTML = `已从 <b>${file.name}</b> 提取出 <b>${records.length}</b> 个唯一号码！当前待入库总数: <b>${pendingRecords.length}</b> 条。`;
      const btn = document.getElementById('batchSubmitBtn');
      btn.disabled = false;
      btn.innerText = `开始写入数据库 (待处理: ${pendingRecords.length} 条)`;
    };
    reader.readAsText(file);
  }

  // 分块极速批量写入 IndexedDB，几十万条也能流畅存入
  function saveBatchRecords() {
    if (pendingRecords.length === 0) return;
    const status = document.getElementById('batchStatus');
    status.innerHTML = '<div class="alert alert-info">正在批量高速写入本地数据库，请稍候...</div>';

    const tx = db.transaction([STORE_NAME], 'readwrite');
    const store = tx.objectStore(STORE_NAME);

    // 循环写入
    for (let i = 0; i < pendingRecords.length; i++) {
      store.put(pendingRecords[i]);
    }

    tx.oncomplete = function() {
      status.innerHTML = `<div class="alert alert-success">🎉 写入完成！已安全永久存入 <b>${pendingRecords.length}</b> 条记录！</div>`;
      pendingRecords = [];
      document.getElementById('batchSubmitBtn').disabled = true;
      document.getElementById('batchSubmitBtn').innerText = '开始写入数据库 (待处理: 0 条)';
      updateTotalCount();
    };

    tx.onerror = function(err) {
      status.innerHTML = `<div class="alert alert-danger">写入失败: ${err.target.error}</div>`;
    };
  }

  // 页面启动初始化
  window.onload = function() {
    initDB();
  };
</script>
